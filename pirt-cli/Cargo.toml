glob = "0.3.3"
log = "0.4.27"
pirt-injector = { path = "../pirt-injector" }
pirt-common = { path = "../pirt-common" }
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
toml = "0.9.5"
